name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mod:
        description: 'Mod to release (leave empty to check all mods)'
        type: choice
        options:
          - ''
          - SimpleUse
          - SimpleMovement
          - CharacterStats
          - CombatStats
          - EnemyStats
          - WeaponStats
        default: ''
      dry_run:
        description: 'Dry run (check versions, no uploads)'
        type: boolean
        default: false
      force:
        description: 'Upload even if the version matches Nexus Mods'
        type: boolean
        default: false
      collection:
        description: 'Sync a Nexus Mods collection with this name (create if missing, revise if it exists)'
        type: string
        default: 'deathbeam-darktide-mods'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Upload changed mods to Nexus Mods
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # inputs.* are empty on push events, so fall back to the default name.
      COLLECTION_NAME: ${{ inputs.collection || 'deathbeam-darktide-mods' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install zip, 7zip, and Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y zip p7zip-full
          python3 -m pip install --upgrade pip
          pip install requests

      - name: Upload changed mods
        env:
          NEXUSMODS_APIKEY: ${{ secrets.NEXUSMODS_APIKEY }}
        run: |
          ARGS=()
          if [ -n "${{ inputs.mod }}" ]; then
            ARGS+=("--mod" "${{ inputs.mod }}")
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=("--dry-run")
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS+=("--force")
          fi
          ARGS+=("--collection" "$COLLECTION_NAME")
          make publish ARGS="${ARGS[*]}"
