name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mod:
        description: 'Mod to release (leave empty to check all mods)'
        type: choice
        options:
          - ''
          - AutoAbilities
          - CombatStats
          - SimpleMinimap
          - SimpleMovement
          - WeaponStats
        default: ''
      dry_run:
        description: 'Dry run (check versions, no uploads)'
        type: boolean
        default: false
      force:
        description: 'Upload even if the version matches Nexus Mods'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Upload changed mods to Nexus Mods
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install zip
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Upload changed mods
        env:
          NEXUSMODS_APIKEY: ${{ secrets.NEXUSMODS_APIKEY }}
        run: |
          ARGS=()
          if [ -n "${{ inputs.mod }}" ]; then
            ARGS+=("--mod" "${{ inputs.mod }}")
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=("--dry-run")
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS+=("--force")
          fi
          make publish ARGS="${ARGS[*]}"
